[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --port /dev/cu.usbmodem21201"

[env]
DEFMT_LOG="info"
# Bound equal-priority control/encoder time slicing to 1ms instead of 10ms.
ESP_RTOS_CONFIG_TICK_RATE_HZ="1000"

[build]
rustflags = [
  "-C", "force-frame-pointers",
  "-Z", "stack-protector=all",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
