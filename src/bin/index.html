<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 温湿度监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .sensor-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .data-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .data-card:hover {
            transform: translateY(-5px);
        }
        .data-card.temperature {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }
        .data-card.humidity {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        .unit {
            font-size: 16px;
            color: #666;
        }
        .refresh-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .refresh-btn:active {
            transform: translateY(0);
        }
        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ 温湿度监控</h1>
        <p class="subtitle">ESP32-C3 + AHT30 传感器</p>

        <div class="sensor-data">
            <div class="data-card temperature">
                <div class="icon">🌡️</div>
                <div class="label">温度</div>
                <div class="value" id="temperature">--</div>
                <div class="unit">°C</div>
            </div>
            <div class="data-card humidity">
                <div class="icon">💧</div>
                <div class="label">湿度</div>
                <div class="value" id="humidity">--</div>
                <div class="unit">%</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchData()">🔄 刷新数据</button>

        <div class="status" id="status">点击按钮获取数据</div>
    </div>

    <script>
        async function fetchData() {
            const btn = document.querySelector('.refresh-btn');
            const status = document.getElementById('status');

            btn.classList.add('loading');
            btn.textContent = '⏳ 加载中...';
            status.textContent = '正在获取数据...';

            try {
                const response = await fetch('/api/temperature');
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();

                document.getElementById('temperature').textContent = data.temperature.toFixed(2);
                document.getElementById('humidity').textContent = data.humidity.toFixed(2);

                status.textContent = `最后更新: ${new Date().toLocaleTimeString('zh-CN')}`;
            } catch (error) {
                console.error('Error:', error);
                status.textContent = '获取数据失败，请重试';
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '🔄 刷新数据';
            }
        }

        // 页面加载时自动获取一次数据
        window.addEventListener('load', fetchData);

        // 每10秒自动刷新
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
